<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkChat - 사내 실시간 메신저</title>
  <!-- Supabase JS 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* CSS Styles */
    :root {
      --sidebar-bg: #0F172A;
      --sidebar-active: #1E293B;
      --sidebar-text: #94A3B8;
      --sidebar-text-active: #FFFFFF;
      --app-bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --bubble-other: #F1F5F9;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border-color: #E2E8F0;
      
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--app-bg);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 1. 로그인 뷰 (#auth-view) */
    #auth-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background-color: var(--app-bg);
    }

    .login-card {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .login-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 32px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 44px;
      background-color: var(--card-bg);
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .google-btn:hover {
      background-color: #F1F5F9;
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
    }

    /* 2. 메인 앱 뷰 (#app-view) */
    #app-view {
      display: none; /* 초기에는 숨김 */
      width: 100vw;
      height: 100vh;
    }

    /* 좌측 사이드바 */
    #sidebar {
      width: 240px;
      height: 100vh;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand-area {
      padding: 20px 16px;
      border-bottom: 1px solid var(--sidebar-active);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-list {
      list-style: none;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-item {
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--sidebar-text);
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item:hover {
      background-color: rgba(30, 41, 59, 0.5);
    }

    .menu-item.active {
      background-color: var(--sidebar-active);
      color: var(--sidebar-text-active);
      border-left: 3px solid var(--primary);
    }

    /* 우측 메인 콘텐츠 */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--app-bg);
    }

    /* 상단 헤더 */
    #header {
      height: 60px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    #header-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-main);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      background-color: var(--primary);
      color: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .user-name {
      font-size: 14px;
      color: #1E293B;
      font-weight: 500;
    }

    .logout-btn {
      background-color: #F1F5F9;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background-color: #E2E8F0;
      color: var(--text-main);
    }

    /* 채팅 뷰 */
    #chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 자식 요소에서 스크롤 처리 */
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 말풍선 공통 */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    .msg-sender {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-sub);
      margin-bottom: 4px;
      margin-left: 4px;
    }

    .msg-content-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg-time {
      font-size: 11px;
      color: var(--sidebar-text);
      white-space: nowrap;
    }

    /* 내 메시지 */
    .msg-me {
      align-self: flex-end;
    }

    .msg-me .msg-bubble {
      background-color: var(--primary);
      color: #FFFFFF;
      border-radius: 14px 14px 2px 14px;
    }

    .msg-me .msg-content-row {
      flex-direction: row-reverse; /* 시간을 왼쪽에 배치 */
    }

    /* 상대방 메시지 */
    .msg-other {
      align-self: flex-start;
    }

    .msg-other .msg-bubble {
      background-color: var(--bubble-other);
      color: var(--text-main);
      border-radius: 14px 14px 14px 2px;
    }

    /* 채팅 입력 바 */
    #chat-input-bar {
      height: 74px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 12px;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      height: 42px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    #msg-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    #send-btn {
      height: 42px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #send-btn:hover {
      background-color: var(--primary-hover);
    }

    /* 게시판 뷰 */
    #board-view {
      flex: 1;
      display: none; /* 초기에는 숨김 */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .board-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .board-title {
      font-size: 18px;
      color: #1E293B;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .board-desc {
      font-size: 14px;
      color: var(--text-sub);
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body>

  <!-- 1. 로그인 뷰 (#auth-view) -->
  <div id="auth-view">
    <div class="login-card">
      <div class="login-icon">💬</div>
      <div class="login-title">사내 실시간 메신저 WorkChat</div>
      <div class="login-subtitle">동료들과 실시간으로 소통하세요.</div>
      
      <button id="google-login-btn" class="google-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google 계정으로 로그인
      </button>
    </div>
  </div>

  <!-- 2. 메인 앱 뷰 (#app-view) -->
  <div id="app-view">
    
    <!-- 좌측 사이드바 -->
    <aside id="sidebar">
      <div class="brand-area">
        💬 WorkChat
      </div>
      <ul class="menu-list">
        <li class="menu-item active" data-target="chat-view" data-title="사내 채팅방">
          💬 사내 채팅방
        </li>
        <li class="menu-item" data-target="board-view" data-title="게시판">
          📚 게시판
        </li>
      </ul>
    </aside>

    <!-- 우측 메인 콘텐츠 -->
    <main id="main-content">
      <!-- 상단 헤더 -->
      <header id="header">
        <div id="header-title">사내 채팅방</div>
        <div class="user-actions">
          <div class="user-profile">
            <div class="avatar" id="user-avatar">G</div>
            <div class="user-name" id="user-name">게스트</div>
          </div>
          <button id="logout-btn" class="logout-btn">로그아웃</button>
        </div>
      </header>

      <!-- 채팅 뷰 -->
      <div id="chat-view">
        <div id="chat-messages">
          <!-- 메시지가 동적으로 추가될 영역 -->
        </div>
        <div id="chat-input-bar">
          <input type="text" id="msg-input" placeholder="메시지를 입력하세요... (Enter를 누르면 전송)" autocomplete="off">
          <button id="send-btn">전송 ✈</button>
        </div>
      </div>

      <!-- 게시판 뷰 (준비 중) -->
      <div id="board-view">
        <div class="board-icon">📚</div>
        <div class="board-title">게시판 기능 준비 중</div>
        <div class="board-desc">사내 공지사항 및 게시판 기능은 현재 개발 중입니다.</div>
      </div>
    </main>
  </div>

  <!-- JS Logic -->
  <script>
    // TODO: 아래 KEY를 본인의 Supabase anon key로 변경하세요.
    const SUPABASE_URL = 'https://wlofjkizagtwzclkxgax.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EEucTB_jntxvAsoAXsAz_w_mKovniU_';
    
    // Supabase 클라이언트 초기화
    let supabase = null;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // 상태 관리 (인메모리)
    const state = {
      isLogged: false,
      currentUser: null,
      messages: [
        { id: 1, sender: "김팀장", text: "오늘 2시 스프린트 리뷰 회의 준비 부탁드립니다.", time: "13:58", isMe: false },
        { id: 2, sender: "이대리", text: "네 팀장님, 발표 자료 정리 완료되었습니다!", time: "14:01", isMe: false },
        { id: 3, sender: "게스트", text: "저도 회의실로 바로 이동하겠습니다.", time: "14:02", isMe: true }
      ]
    };

    // DOM 요소 참조
    const authView = document.getElementById('auth-view');
    const appView = document.getElementById('app-view');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userNameEl = document.getElementById('user-name');
    const userAvatarEl = document.getElementById('user-avatar');
    
    const menuItems = document.querySelectorAll('.menu-item');
    const headerTitle = document.getElementById('header-title');
    const chatView = document.getElementById('chat-view');
    const boardView = document.getElementById('board-view');
    
    const chatMessagesContainer = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // 시간 포맷팅 헬퍼 (HH:MM)
    function getCurrentTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // 메시지 렌더링 함수
    function renderMessages() {
      chatMessagesContainer.innerHTML = ''; // 초기화
      state.messages.forEach(msg => {
        const msgWrapper = document.createElement('div');
        msgWrapper.className = `msg-wrapper ${msg.isMe ? 'msg-me' : 'msg-other'}`;
        
        let senderHtml = '';
        if (!msg.isMe) {
          senderHtml = `<div class="msg-sender">${msg.sender}</div>`;
        }
        
        msgWrapper.innerHTML = `
          ${senderHtml}
          <div class="msg-content-row">
            <div class="msg-bubble">${msg.text}</div>
            <div class="msg-time">${msg.time}</div>
          </div>
        `;
        
        chatMessagesContainer.appendChild(msgWrapper);
      });
      scrollToBottom();
    }

    // 스크롤 최하단 이동
    function scrollToBottom() {
      chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
    }

    // 메시지 전송 로직
    function sendMessage() {
      const text = msgInput.value.trim();
      if (text.length === 0) return;

      const newMessage = {
        id: Date.now(),
        sender: state.currentUser?.name || "게스트",
        text: text,
        time: getCurrentTime(),
        isMe: true
      };

      // 배열에 추가
      state.messages.push(newMessage);
      
      // 화면 렌더링
      renderMessages();
      
      // 입력창 초기화
      msgInput.value = '';
      msgInput.focus();

      // TODO: Supabase 연동 - 실시간 DB INSERT
      // 예: await supabase.from('messages').insert([{ text: text, sender: state.currentUser?.name, created_at: new Date() }])
    }

    // Supabase 세션 체크 및 UI 업데이트 (onAuthStateChange)
    if (supabase) {
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          state.isLogged = true;
          // 구글 로그인 시 제공되는 이름 사용
          const userName = session.user.user_metadata?.full_name || "게스트";
          state.currentUser = { name: userName, email: session.user.email };
          
          userNameEl.textContent = state.currentUser.name;
          userAvatarEl.textContent = state.currentUser.name.charAt(0).toUpperCase();
          
          authView.style.display = 'none';
          appView.style.display = 'flex';
          renderMessages();
        } else {
          state.isLogged = false;
          state.currentUser = null;
          
          appView.style.display = 'none';
          authView.style.display = 'flex';
        }
      });
    }

    // 이벤트 리스너: 구글 로그인
    googleLoginBtn.addEventListener('click', async () => {
      if (supabase) {
        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            // 아래 주소는 현재 배포된 GitHub Pages 주소로 설정합니다.
            redirectTo: 'https://jhkimseven.github.io/'
          }
        });
        if (error) {
          console.error("로그인 에러:", error);
          alert("로그인 중 오류가 발생했습니다.");
        }
      } else {
        alert("Supabase 클라이언트가 초기화되지 않았습니다. URL과 KEY를 확인해주세요.");
      }
    });

    // 이벤트 리스너: 로그아웃
    logoutBtn.addEventListener('click', async () => {
      if (supabase) {
        await supabase.auth.signOut();
      }
    });

    // 이벤트 리스너: 메뉴 전환
    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        // 활성 클래스 변경
        menuItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
        
        // 헤더 타이틀 변경
        headerTitle.textContent = item.getAttribute('data-title');
        
        // 뷰 전환
        const targetId = item.getAttribute('data-target');
        if (targetId === 'chat-view') {
          chatView.style.display = 'flex';
          boardView.style.display = 'none';
          scrollToBottom();
        } else {
          chatView.style.display = 'none';
          boardView.style.display = 'flex';
        }
      });
    });

    // 이벤트 리스너: 메시지 전송 버튼
    sendBtn.addEventListener('click', sendMessage);

    // 이벤트 리스너: 엔터키 전송
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // TODO: Supabase 연동 - 실시간 메시지 수신 (supabase.channel.on)
    // 예: supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
    //       state.messages.push(payload.new);
    //       renderMessages();
    //     }).subscribe();

  </script>
</body>
</html>
